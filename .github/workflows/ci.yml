name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate taxonomy
        run: node scripts/check-taxonomy.mjs
      - name: Rebuild family and views
        run: node scripts/build-family.mjs
      - name: Rebuild taxonomy page
        run: node scripts/build-docs.mjs
      - name: Verify checked-in generated files
        run: git diff --exit-code -- family.json views docs/taxonomy.html
      - name: Verify package/docs metadata
        run: node scripts/check-docs.mjs
