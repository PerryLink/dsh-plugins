name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate taxonomy
        run: node scripts/check-taxonomy.mjs
      - name: Rebuild family and views
        run: node scripts/build-family.mjs
      - name: Rebuild taxonomy page
        run: node scripts/build-docs.mjs
      - name: Verify checked-in generated files
        run: git diff --exit-code -- family.json views docs/taxonomy.html docs/family docs/family.html docs/packages README.md docs/index.html
      - name: Rebuild the family index page
        run: node scripts/build-family-page.mjs

      - name: Rebuild the market page
        run: node scripts/build-market-page.mjs
      - name: Verify the market index
        run: node scripts/build-market-index.mjs --check
      - name: Verify checked-in market page
        run: git diff --exit-code -- docs/market.html
      - name: Verify package/docs metadata
        run: node scripts/check-docs.mjs
