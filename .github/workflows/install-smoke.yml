name: install-smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # Monday 11:00 Asia/Shanghai

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-latest
    outputs:
      specs: ${{ steps.gen.outputs.specs }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Generate pins from packages.json
        id: gen
        shell: bash
        run: |
          {
            echo 'specs<<EOF'
            node scripts/gen-smoke-pins.mjs --json
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Show pins
        run: node scripts/gen-smoke-pins.mjs

  smoke:
    needs: pins
    runs-on: ubuntu-latest
    name: smoke ${{ matrix.spec }}
    strategy:
      fail-fast: false
      matrix:
        spec: ${{ fromJSON(needs.pins.outputs.specs) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install DSH and pnpm
        run: npm install -g @deepseek-ai/dsh@0.2.1-rc.5 pnpm@11.28.5
      - name: Install ${{ matrix.spec }} into a fresh profile
        shell: bash
        env:
          SPEC: ${{ matrix.spec }}
        run: |
          export DSH_HOME="$(mktemp -d)"
          trap 'rm -rf "$DSH_HOME"' EXIT
          echo "== $SPEC"
          if dsh plugin --profile web add "$SPEC" >/tmp/dsh-add.log 2>&1 && \
             dsh --profile web --dump-config 2>/dev/null | grep -q "${SPEC%@*}"; then
            echo "OK $SPEC"
          else
            echo "FAIL $SPEC"
            tail -30 /tmp/dsh-add.log || true
            exit 1
          fi
